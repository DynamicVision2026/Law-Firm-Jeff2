<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法律トラブル 無料プレチェック</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1c1c1e; --muted: #6b6a70; --line: #e2ded5;
    --accent: #1f4e79; --accent-soft: #e8eff6; --on-accent: #ffffff;
    --high: #b3261e; --mid: #a86200; --low: #2e7d32;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.65 "Hiragino Sans", "Noto Sans JP", "Noto Sans TC", "Noto Sans SC", system-ui, sans-serif; }
  main { max-width: 600px; margin: 0 auto; padding: 20px 16px 72px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .langs { display: flex; gap: 6px; }
  .langs button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  h1 { font-size: 23px; margin: 8px 0 2px; }
  .tagline { color: var(--accent); font-weight: 700; font-size: 14px; margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 12px 0; }
  textarea, input[type=text] { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  textarea { min-height: 140px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { border: 1px dashed var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  details summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 6px; }
  .example { background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 14px; cursor: pointer; border: 1px solid transparent; }
  .example:hover { border-color: var(--line); }
  .linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 10px; }
  .consent { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 14px 0; }
  .primary { width: 100%; padding: 14px; font: inherit; font-weight: 700; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  .primary:disabled { opacity: .4; cursor: not-allowed; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  .q { font-size: 19px; font-weight: 700; margin: 6px 0 14px; }
  .opts { display: grid; gap: 8px; }
  .opt { text-align: left; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font: inherit; cursor: pointer; }
  .opt:hover, .opt:focus-visible { border-color: var(--accent); outline: none; }
  .opt.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .back { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; }
  .detected { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; }
  .headline { font-size: 21px; font-weight: 800; margin: 10px 0 4px; }
  .lvl-high { color: var(--high); } .lvl-medium { color: var(--mid); } .lvl-low { color: var(--low); }
  .stake { font-weight: 600; margin: 4px 0; }
  .range { font-size: 26px; font-weight: 800; margin: 2px 0; }
  h3 { font-size: 15px; margin: 16px 0 6px; }
  ul { margin: 0; padding-left: 20px; }
  .warn { border-left: 4px solid var(--mid); background: #fbf4e9; padding: 8px 12px; border-radius: 6px; margin: 6px 0; font-size: 15px; }
  .warn.high { border-color: var(--high); background: #fbefee; }
  .warn.info { border-color: var(--accent); background: var(--accent-soft); }
  .foot { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 10px; font-size: 12px; color: var(--muted); }
  .badge { display: inline-block; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-size: 12px; margin-bottom: 6px; }
  .note { background: #fff4d6; border: 1px solid #e8c766; border-radius: 8px; padding: 6px 10px; font-size: 12px; margin-top: 8px; }
  .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 30px auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .quick { border: 1px solid var(--accent); }
  .quickhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .pct { font-size: 16px; color: var(--muted); font-weight: 700; }
  .outrow { display: flex; align-items: center; gap: 12px; }
  .big { font-size: 34px; font-weight: 800; line-height: 1; min-width: 3.2ch; }
  .big.good { color: var(--low); } .big.mid { color: var(--mid); } .big.weak { color: var(--high); }
  .meter { flex: 1; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--accent); }
  .meter.good > div { background: var(--low); } .meter.mid > div { background: var(--mid); } .meter.weak > div { background: var(--high); }
  .factors { list-style: none; padding: 0; display: grid; gap: 6px; }
  .factors li { display: flex; gap: 8px; align-items: flex-start; }
  .factors li span { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; margin-top: 2px; }
  .factors li.ok span { background: var(--low); } .factors li.ng span { background: var(--mid); }
  .why { margin: 4px 0 0; font-size: 14px; color: var(--muted); line-height: 1.55; }
  .why:not(.on)::after { content: "…"; }
  .why.on { color: var(--ink); background: var(--bg); border-radius: 8px; padding: 6px 10px; }
  .factors li > div { flex: 1; min-width: 0; }
  .similar { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  .split { margin: 8px 0 0; padding-left: 18px; font-size: 14px; display: grid; gap: 2px; }
  .split li.has { font-weight: 700; } .split li.lacks { font-weight: 700; color: var(--mid); }
  .vs { display: grid; grid-template-columns: 6.5em 3.6em 1fr; align-items: center; gap: 8px; margin: 4px 0; }
  .vs .lab { font-size: 14px; } .vs .big { font-size: 26px; }
  .attach { margin-top: 10px; }
  .attachbtn { display: inline-block; border-style: solid; }
  #attachmsg.kind { background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 8px 10px; font-size: 13px !important; }
  .topnav { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .summary { border: 2px solid var(--accent); }
  .summary dl { margin: 0; display: grid; gap: 4px; }
  .summary dt { font-size: 13px; color: var(--muted); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
  .summary dd { margin: 0 0 0 26px; font-size: 16px; }
  .summary .n { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .summary b.good, .similar b.good { color: var(--low); } .summary b.mid { color: var(--mid); } .summary b.weak { color: var(--high); }
  .fine { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
  .steps { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
  .cta { background: var(--accent-soft); border-color: var(--accent); }
  .center { text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <span class="muted" id="badge"></span>
    <div class="langs" id="langs"></div>
  </header>
  <div id="app"></div>
</main>

<script type="module">
import { COPY } from "../engine/copy.js";
const matches = (cond, answers) => Object.entries(cond).every(([id, want]) => (Array.isArray(want) ? want.includes(answers[id]) : answers[id] === want));

const MARKETS = { jp: { lang: "ja", name: "日本語" }, tw: { lang: "zh-Hant", name: "繁體中文" }, cn: { lang: "zh-Hans", name: "简体中文" } };
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let S = {}; // state
const t = () => COPY[MARKETS[S.market].lang];

function reset(market = S.market || "jp") {
  S = { market, text: "", consent: true, guided: false, guidedAns: {}, guidedStep: 0, triage: null, answers: {}, step: 0, result: null };
  document.documentElement.lang = MARKETS[market].lang;
  document.title = t().title;
  document.querySelectorAll("#langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === market));
  renderStart();
}

// ---------- screen 1: describe the problem ----------
function renderStart() {
  const c = t();
  if (S.guided) return renderGuided();
  app.innerHTML = `
    <h1>${esc(c.title)}</h1>
    <p class="tagline">${esc(c.tagline)}</p>
    <p class="muted">${esc(c.intro)}</p>
    <div class="card">
      <textarea id="text" placeholder="${esc(c.placeholder)}" maxlength="2000">${esc(S.text)}</textarea>
      <p class="muted" style="margin:6px 0 0">${esc(c.noNames)}</p>
      <div class="attach"><label class="chip attachbtn" for="files">${esc(c.attach)}</label>
        <input type="file" id="files" multiple accept="image/*,application/pdf" hidden>
        <p class="muted" id="attachmsg" style="margin:4px 0 0;font-size:12px">${esc(c.attachNote)}</p></div>
      <p class="muted" style="margin:10px 0 0">${esc(c.guideTitle)}</p>
      <div class="chips">${c.guides.map((g, i) => `<button type="button" class="chip" data-g="${i}">＋ ${esc(g.label)}</button>`).join("")}</div>
      <details><summary>${esc(c.examplesTitle)}</summary>${c.examples.map((e, i) => `<div class="example" data-e="${i}">${esc(e)}</div>`).join("")}</details>
      <button type="button" class="linkbtn" id="toGuided">${esc(c.guidedToggle)} →</button>
    </div>
    <label class="consent"><input type="checkbox" id="consent" ${S.consent ? "checked" : ""}> <span>${esc(c.consent)}</span></label>
    <button class="primary" id="go">${esc(c.start)}</button>`;
  const ta = app.querySelector("#text");
  const sync = () => { S.text = ta.value; app.querySelector("#go").disabled = S.text.trim().length < 8; };
  ta.addEventListener("input", sync); sync();
  app.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => {
    ta.value += c.guides[b.dataset.g].insert; ta.focus(); sync();
  });
  app.querySelectorAll("[data-e]").forEach((d) => d.onclick = () => { ta.value = c.examples[d.dataset.e]; sync(); });
  app.querySelector("#toGuided").onclick = () => { S.guided = true; S.guidedStep = 0; renderStart(); };
  app.querySelector("#consent").onchange = (e) => (S.consent = e.target.checked);
  app.querySelector("#go").onclick = submitText;
  app.querySelector("#files").onchange = (e) => attachFiles([...e.target.files], ta, sync);
}

// Photos are shrunk in the browser (also removes location data); PDFs are sent as they are.
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      resolve({ type: "image/jpeg", data: cv.toDataURL("image/jpeg", 0.85).split(",")[1] });
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
const readPdf = (file) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve({ type: "application/pdf", data: String(r.result).split(",")[1] });
  r.onerror = reject; r.readAsDataURL(file);
});
async function attachFiles(list, ta, sync) {
  const c = t(), msg = app.querySelector("#attachmsg"), go = app.querySelector("#go");
  const picked = list.slice(0, 5);
  if (!picked.length) return;
  if (picked.some((f) => f.type === "application/pdf" && f.size > 8e6)) { msg.textContent = c.attachTooBig; return; }
  msg.textContent = c.attachReading; go.disabled = true;
  try {
    const files = await Promise.all(picked.map((f) => (f.type === "application/pdf" ? readPdf(f) : shrinkImage(f))));
    const r = await api("/api/docs", { market: S.market, files });
    if (r.error) throw new Error("failed");
    if (!r.used || !r.summary) { msg.textContent = c.attachRejected; msg.classList.add("kind"); }
    else {
      ta.value = (ta.value.trim() ? ta.value.trim() + "\n\n" : "") + c.attachHeader + "\n" + r.summary;
      msg.textContent = c.attachDone(r.used) + (r.skipped ? " " + c.attachSkipped(r.skipped) : "");
      msg.classList.remove("kind");
    }
  } catch { msg.textContent = c.attachError; }
  app.querySelector("#files").value = "";
  sync();
}

// ---------- guided mode: 5 short questions that write the description ----------
const GUIDED_KEYS = ["who", "what", "when", "money", "want"];
function renderGuided() {
  const c = t(), g = c.guided, i = S.guidedStep, key = GUIDED_KEYS[i], q = g[key];
  const body = q.options
    ? `<div class="opts">${q.options.map((o) => `<button class="opt ${S.guidedAns[key] === o ? "sel" : ""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`
    : `<input type="text" id="gin" placeholder="${esc(q.ph)}" value="${esc(S.guidedAns[key] || "")}" maxlength="120"><div class="row"><span></span><button class="primary" style="width:auto;padding:10px 22px" id="gnext">${esc(c.next)}</button></div>`;
  app.innerHTML = `
    <h1>${esc(c.title)}</h1>
    <div class="progress"><div style="width:${(i / GUIDED_KEYS.length) * 100}%"></div></div>
    <p class="muted">${esc(c.step(i + 1, GUIDED_KEYS.length))}</p>
    <div class="card"><p class="q">${esc(q.q)}</p>${body}
      <div class="row"><button class="back" id="gback">← ${esc(i ? c.back : c.freeToggle)}</button></div></div>`;
  const advance = () => {
    if (S.guidedStep < GUIDED_KEYS.length - 1) { S.guidedStep++; return renderGuided(); }
    S.text = g.compose(S.guidedAns); S.guided = false; submitText();
  };
  app.querySelectorAll(".opt").forEach((b) => b.onclick = () => { S.guidedAns[key] = b.dataset.v; advance(); });
  const inp = app.querySelector("#gin");
  if (inp) {
    const go = () => { if (inp.value.trim()) { S.guidedAns[key] = inp.value.trim(); advance(); } };
    app.querySelector("#gnext").onclick = go;
    inp.addEventListener("keydown", (e) => e.key === "Enter" && go());
    inp.focus();
  }
  app.querySelector("#gback").onclick = () => { if (i) { S.guidedStep--; renderGuided(); } else { S.guided = false; renderStart(); } };
}

// ---------- call the server ----------
async function api(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
function thinking() { app.innerHTML = `<div class="spinner"></div><p class="center muted">${esc(t().thinking)}</p>`; }
function fail() { app.innerHTML = `<div class="card">${esc(t().error)}</div><button class="primary" id="re">${esc(t().restart)}</button>`; app.querySelector("#re").onclick = () => reset(); }

async function submitText() {
  thinking();
  try {
    S.triage = await api("/api/triage", { market: S.market, text: S.text });
    S.answers = { ...(S.triage.known || {}) }; S.known = new Set(Object.keys(S.triage.known || {})); S.step = 0;
    renderFollowup();
  } catch { fail(); }
}

// ---------- screen 2: follow-up questions, one per screen ----------
const visible = () => S.triage.followups.filter((q) => !q.show_if || matches(q.show_if, S.answers));
const toAsk = () => visible().filter((q) => !S.known?.has(q.id)); // already answered in the description: not asked again
function renderFollowup() {
  const c = t(), qs = toAsk();
  if (S.step >= qs.length) return getReport();
  const q = qs[S.step];
  app.innerHTML = `
    <span class="detected">${esc(c.detected)}：${esc(S.triage.categoryLabel)}</span>
    <div class="progress"><div style="width:${(S.step / qs.length) * 100}%"></div></div>
    <p class="muted">${esc(c.step(S.step + 1, qs.length))}${S.known?.size ? `　${esc(c.knownNote(S.known.size))}` : ""}</p>
    <div class="card"><p class="q">${esc(q.text)}</p>${q.help ? `<p class="muted">${esc(q.help)}</p>` : ""}
      <div class="opts">${q.options.map((o) => `<button class="opt ${S.answers[q.id] === o.value ? "sel" : ""}" data-v="${esc(o.value)}">${esc(o.label)}</button>`).join("")}</div>
      <div class="row"><button class="back" id="back">← ${esc(c.back)}</button></div></div>
    ${S.triage.mock ? `<p class="note">${esc(c.mock)}</p>` : ""}`;
  app.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
    S.answers[q.id] = b.dataset.v;
    // drop answers to questions that are now hidden
    const ids = new Set(visible().map((x) => x.id));
    for (const k of Object.keys(S.answers)) if (!ids.has(k) && !S.known?.has(k)) delete S.answers[k];
    S.step++; renderFollowup();
  });
  app.querySelector("#back").onclick = () => { if (S.step) { S.step--; renderFollowup(); } else renderStart(); };
}

async function getReport() {
  thinking();
  try {
    S.result = await api("/api/judge", {
      market: S.market, text: S.text, category: S.triage.category, answers: S.answers, followups: visible(),
      consent: S.consent, aiCategory: S.triage.aiCategory, quickCategory: S.triage.quick?.category ?? null,
    });
    renderResult();
    if (!S.result.similar) api("/api/similar", { market: S.market, category: S.result.category, verdict: S.result })
      .then(renderWeb).catch(() => renderWeb(null));
    api("/api/explain", { market: S.market, text: S.text, answers: S.answers, followups: visible(), verdict: S.result })
      .then(renderExplain).catch(() => renderExplain(null));
  } catch { fail(); }
}

// ---------- screen 3: the report — the instant check first, then money, cost, and the AI's explanation ----------
const bar = (pct, cls = "") => `<div class="meter ${cls}"><div style="width:${Math.max(3, Math.min(100, pct))}%"></div></div>`;
function similarBlock(x, R) {
  if (!x) return "";
  const cls = x.winPct >= 60 ? "good" : x.winPct >= 35 ? "mid" : "weak";
  const fmt = (n) => Number(n).toLocaleString("en-US");
  return `<div class="similar">
    <p style="margin:0 0 4px"><b>${esc(R.similarTitle(x.n, x.years))}</b></p>
    <p class="muted" style="margin:6px 0 2px">${esc(R.similarWin)}</p>
    <div class="outrow"><span class="big ${cls}">${x.winPct}%</span>${bar(x.winPct, cls)}</div>
    ${x.contestedWinPct != null ? `<p class="muted" style="margin:4px 0 0">${esc(R.similarContested(x.contestedWinPct))}</p>` : ""}
    ${x.medianAwarded ? `<p style="margin:8px 0 0">${esc(R.similarAward(fmt(x.medianAwarded), x.medianAwardedOfClaim))}</p>` : ""}
    ${x.factors.length ? `<ul class="split">${x.factors.map((f) => `<li class="${f.personHas === true ? "has" : f.personHas === false ? "lacks" : ""}">${esc(R.similarWith(f.label, f.withPct, f.withoutPct))}</li>`).join("")}</ul>` : ""}
    <p class="fine">${esc(R.similarNote)}</p>
  </div>`;
}
function renderResult() {
  const c = t(), R = c.r, r = S.result;
  const pcls = (p) => (p >= 60 ? "good" : p >= 35 ? "mid" : "weak");
  const outCls = r.outlook.pct >= 60 ? "good" : r.outlook.pct >= 35 ? "mid" : "weak";
  let h = `<div class="topnav"><button class="back" id="editAns">← ${esc(c.editAnswers)}</button><button class="back" id="editText">✎ ${esc(c.editText)}</button></div>
  <span class="detected">${esc(c.detected)}：${esc(r.categoryLabel)}</span>`;

  // 0. the five answers at a glance, with the lawyer button
  const okN = r.factors.filter((f) => f.ok).length;
  const feeShort = r.fee.text.split(/[；;（(]/)[0];
  const rows = [
    [R.sumQ[0], `<b class="lvl-${r.level}">${esc(R.need[r.need.value] || "")}</b> <span class="pct">${r.need.pct}%</span>`],
    [R.sumQ[1], esc(feeShort) + (r.fee.small ? ` <span class="lvl-medium">⚠</span>` : "")],
    [R.sumQ[2], esc(R.sumHelp(okN, r.factors.length))],
    [R.sumQ[3], `<span id="sumOdds" class="muted">${esc(R.checking)}</span><span id="sumweb"></span>`],
  ];
  h += `<div class="card summary"><p class="q" style="margin:0 0 8px">${esc(R.sumTitle)}</p>
    <dl>${rows.map(([q, a], i) => `<dt><span class="n">${i + 1}</span>${esc(q)}</dt><dd>${a}</dd>`).join("")}
    <dt><span class="n">5</span>${esc(R.sumQ[4])}</dt><dd id="req"><p class="muted" style="margin:0 0 8px">${esc(R.requestText)}</p><button class="primary" id="reqbtn">${esc(R.requestBtn)}</button></dd></dl>
  </div>
  <p class="muted center" style="margin:18px 0 6px">▼ ${esc(R.sumDetail)}</p>`;

  // 1. instant check
  h += `<div class="card quick">
    <div class="quickhead"><b>${esc(R.quickTitle)}</b><span class="muted">${esc(R.quickSpeed(r.seconds))}</span></div>
    ${r.source === "ai" ? `<p class="muted" style="margin:0">${esc(R.byAI)}</p>` : ""}
    <p class="muted" style="margin:10px 0 2px">${esc(R.needQ)}</p>
    <p class="headline lvl-${r.level}" style="margin:0">${esc(R.need[r.need.value] || "")} <span class="pct">${r.need.pct}%</span></p><p class="why" data-why="need"></p>
    <p class="muted" style="margin:12px 0 2px">${esc(R.outlookQ)}</p>
    <div id="odds"><p class="muted" style="margin:6px 0">${esc(R.checking)}</p></div>
    <p class="why" data-why="alone"></p><p class="why" data-why="outlook"></p>
    ${r.urgency != null ? `<p style="margin:10px 0 0">${esc(R.urgency)}：<b class="lvl-${["low", "medium", "high"][r.urgency]}">${esc(R.urg[r.urgency])}</b></p>` : ""}
    ${r.similar ? similarBlock(r.similar, R) : `<div class="similar" id="web"><p class="muted" style="margin:0">${esc(R.webSearching)}</p></div>`}
    <h3>${esc(R.factors)}</h3>
    <ul class="factors">${r.factors.map((f) => `<li class="${f.ok ? "ok" : "ng"}"><span>${f.ok ? "✓" : "!"}</span><div>${esc(f.label)}<p class="why" data-why="c_${esc(f.id)}"></p></div></li>`).join("")}</ul>
    <p class="fine">${esc(R.outlookNote)}</p>
  </div>`;

  // 2. money, lawyer fees, what a lawyer changes
  h += `<div class="card">`;
  if (r.money) h += `<h3 style="margin-top:0">${esc(R.money)}</h3><p class="range">${esc(r.money.text)}</p>${r.money.note ? `<p class="muted">${esc(r.money.note)}</p>` : ""}`;
  h += `<h3${r.money ? "" : ' style="margin-top:0"'}>${esc(R.fee)}</h3><p>${esc(r.fee.text)}</p>`;
  if (r.fee.small) h += `<div class="warn">${esc(r.fee.smallText)}</div>`;
  h += `<h3>${esc(R.help)}</h3><p>${esc(r.help)}</p>`;
  h += `<h3>${esc(R.free)}</h3><p class="muted">${esc(r.free)}</p></div>`;

  // 3. the AI's explanation (arrives a few seconds later)
  h += `<div class="card" id="explain"><p class="center muted" style="margin:0">${esc(R.explaining)}</p></div>`;

  // 4. lawyer review — the moment the person shares their case

  h += `<div class="card" id="fb"><p class="q" style="font-size:16px">${esc(c.feedbackQ)}</p>
        <div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt" data-h="yes">${esc(c.yes)}</button><button class="opt" data-h="no">${esc(c.no)}</button></div></div>`;
  h += `<div class="foot"><span class="badge">${esc(r.supervision)}</span><br>${esc(r.disclaimer)}</div>`;
  h += `<button class="primary" id="re" style="margin-top:14px">${esc(c.restart)}</button>`;
  if (r.draft) h += `<p class="note">DRAFT — 弁護士確認前 / 律師確認前 / 律师确认前</p>`;
  app.innerHTML = h;
  window.scrollTo({ top: 0, behavior: "smooth" });
  app.querySelector("#re").onclick = () => reset();
  // Change answers: show every question (also the ones filled from the description), starting at the last one.
  app.querySelector("#editAns").onclick = () => { S.known = new Set(); S.step = Math.max(0, visible().length - 1); renderFollowup(); };
  app.querySelector("#editText").onclick = () => { S.guided = false; renderStart(); };
  app.querySelector("#reqbtn").onclick = () => {
    api("/api/request", { id: r.id, market: S.market, category: r.category }).catch(() => {});
    app.querySelector("#req").innerHTML = `<p class="center" style="margin:0">✓ ${esc(R.requestDone)}</p>`;
  };
  app.querySelectorAll("[data-h]").forEach((b) => b.onclick = () => {
    const helpful = b.dataset.h;
    const fb = app.querySelector("#fb");
    fb.innerHTML = `<p class="q" style="font-size:16px">${esc(c.wantedQ)}</p><div class="opts">${c.wanted.map((w) => `<button class="opt" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>`;
    fb.querySelectorAll("[data-w]").forEach((x) => x.onclick = () => {
      if (S.consent) api("/api/feedback", { id: r.id, helpful, wanted: x.dataset.w }).catch(() => {});
      fb.innerHTML = `<p class="center">${esc(c.thanks)}</p>`;
    });
  });
}

function renderWeb(w) {
  const box = app.querySelector("#web");
  if (!box) return;
  if (!w) return box.remove();
  const R = t().r, cls = w.pct >= 60 ? "good" : w.pct >= 35 ? "mid" : "weak";
  const sw = app.querySelector("#sumweb");
  if (sw && w.pct != null) sw.innerHTML = ` ・ <b class="${cls}">≈${w.pct}%</b> <span class="muted">(${esc(R.webShort)})</span>`;
  box.innerHTML = `<p style="margin:0 0 4px"><b>${esc(R.webTitle)}</b></p>
    ${w.pct != null ? `<p class="muted" style="margin:6px 0 2px">${esc(R.webPct)}</p><div class="outrow"><span class="big ${cls}">≈${w.pct}%</span>${bar(w.pct, cls)}</div>` : ""}
    ${w.typical ? `<p style="margin:8px 0 0">${esc(w.typical)}</p>` : ""}
    ${w.basis ? `<p class="muted" style="margin:6px 0 0">${esc(w.basis)}</p>` : ""}
    ${w.sources.length ? `<p class="fine" style="margin-top:6px">${esc(R.webSources)}：${w.sources.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title.slice(0, 40))}</a>`).join(" ・ ")}</p>` : ""}
    <p class="fine">${esc(R.webNote)}</p>`;
}

// The two outcome numbers are shown once the AI has checked them against the facts (engine numbers if that fails).
function renderOdds(o) {
  const R = t().r, pc = (p) => (p >= 60 ? "good" : p >= 35 ? "mid" : "weak");
  const od = app.querySelector("#odds"), so = app.querySelector("#sumOdds");
  if (od) od.innerHTML = `<div class="vs"><span class="lab">${esc(R.aloneL)}</span><span class="big ${pc(o.alone)}">${o.alone}%</span>${bar(o.alone, pc(o.alone))}</div>
    <div class="vs"><span class="lab"><b>${esc(R.lawyerL)}</b></span><span class="big ${pc(o.with)}">${o.with}%</span>${bar(o.with, pc(o.with))}</div>`;
  if (so) { so.className = ""; so.innerHTML = `${esc(R.aloneL)} <b class="${pc(o.alone)}">${o.alone}%</b> → ${esc(R.lawyerL)} <b class="${pc(o.with)}">${o.with}%</b>`; }
}

function renderExplain(e) {
  const box = app.querySelector("#explain");
  if (!box) return;
  const R = t().r, r = S.result;
  renderOdds(e?.odds || { alone: r.alone.pct, with: r.outlook.pct });
  app.querySelectorAll("[data-why]").forEach((p) => {
    const k = p.dataset.why;
    const txt = !e ? "" : k === "need" ? e.reasons.need : k === "outlook" ? e.reasons.outlook : k === "alone" ? e.reasons.alone : e.reasons.checks[k.slice(2)];
    if (txt) { p.textContent = txt; p.classList.add("on"); } else p.remove();
  });
  if (!e) { box.remove(); return; }
  const warns = (r.packWarnings || []).slice(0, 2);
  box.innerHTML = `<h3 style="margin-top:0">${esc(R.steps)}</h3><ol class="steps">${e.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
    ${warns.length ? `<h3>${esc(R.warnings)}</h3>${warns.map((w) => `<div class="warn ${esc(w.level)}">${esc(w.text)}</div>`).join("")}` : ""}`;
}

// ---------- language switch ----------
document.getElementById("langs").innerHTML = Object.entries(MARKETS).map(([m, v]) => `<button type="button" data-m="${m}">${v.name}</button>`).join("");
document.getElementById("langs").onclick = (e) => e.target.dataset.m && reset(e.target.dataset.m);
const start = new URLSearchParams(location.search).get("m");
reset(MARKETS[start] ? start : "jp");
</script>
</body>
</html>
